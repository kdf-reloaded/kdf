name: Build Android

# P7.5 — Android (aarch64, armv7) static library builds.
#
# Produces a static archive `libkdf.a` (renamed from the raw
# `libmm2_bin_lib.a`) for each ABI, built with
# `cargo rustc --crate-type=staticlib` against the Android NDK clang
# toolchain (mirrors upstream KDF; no cargo-ndk). Requires the Android NDK.
# Host runner is Linux (GitHub-hosted `ubuntu-latest` ships the NDK under
# `$ANDROID_NDK_ROOT`).
#
# Manually dispatched until verified against a downstream Android project.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "cargo profile"
        required: false
        default: "release"
  workflow_call:
    inputs:
      profile:
        description: "cargo profile"
        required: false
        default: "release"
        type: string

jobs:
  build:
    # GitHub-hosted Ubuntu runner; the image ships the Android NDK under
    # $ANDROID_NDK_ROOT (the "Verify Android NDK" step also probes the
    # standard install locations as a fallback).
    runs-on: ubuntu-latest
    timeout-minutes: 90

    # NDK clang wrappers (API 21) for the `cc` crate and cargo's linker. Both
    # ABIs' vars are set unconditionally; only the one matching the build
    # target is consumed. The wrappers are resolved via PATH (see the
    # "Verify Android NDK" step). Mirrors upstream: only CC_* and the target
    # LINKER are exported.
    env:
      CC_aarch64_linux_android: aarch64-linux-android21-clang
      CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: aarch64-linux-android21-clang
      CC_armv7_linux_androideabi: armv7a-linux-androideabi21-clang
      CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER: armv7a-linux-androideabi21-clang

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            ndk-abi: arm64-v8a
          - target: armv7-linux-androideabi
            ndk-abi: armeabi-v7a

    steps:
      - uses: actions/checkout@v7

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain for ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}

      - name: Verify Android NDK
        # On GitHub-hosted runners ANDROID_NDK_ROOT is normally exported by
        # the image. If it is not set, probe the standard install locations
        # (including the hosted image path under
        # /usr/local/lib/android/sdk/ndk) as a fallback.
        run: |
          if [ -z "$ANDROID_NDK_ROOT" ]; then
            for cand in \
              "$ANDROID_NDK_HOME" \
              "$HOME/Android/Sdk/ndk"/* \
              "/opt/android-ndk" \
              "/opt/android-sdk/ndk"/* \
              "/usr/local/lib/android/sdk/ndk"/*; do
              if [ -d "$cand" ] && [ -f "$cand/source.properties" ]; then
                echo "ANDROID_NDK_ROOT=$cand" >> $GITHUB_ENV
                ANDROID_NDK_ROOT="$cand"
                break
              fi
            done
          fi
          test -d "$ANDROID_NDK_ROOT" || {
            echo "ANDROID_NDK_ROOT not set or missing"; exit 1;
          }
          echo "NDK: $ANDROID_NDK_ROOT"
          # Put the NDK LLVM clang wrappers (e.g. aarch64-linux-android21-clang)
          # on PATH so cargo's linker and the `cc` crate find them in later steps.
          ndk_bin=$(echo "$ANDROID_NDK_ROOT"/toolchains/llvm/prebuilt/*/bin)
          test -d "$ndk_bin" || { echo "NDK toolchain bin not found: $ndk_bin"; exit 1; }
          echo "$ndk_bin" >> "$GITHUB_PATH"

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: android-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build mm2_bin_lib staticlib (${{ matrix.ndk-abi }})
        # Override the manifest crate-type (cdylib/rlib) with `staticlib` so
        # cargo emits `libmm2_bin_lib.a` (mirrors upstream's
        # `cargo rustc --crate-type=staticlib`). The NDK clang wrappers are
        # supplied via the job `env:` block and PATH.
        run: |
          cargo rustc -p mm2_bin_lib --lib \
            --target ${{ matrix.target }} \
            --profile ${{ inputs.profile }} \
            --crate-type=staticlib

      - name: Verify coins crate compiles for ${{ matrix.target }} (P14)
        # P14 modernised the Solana stack to the modular `solana-*` 2.x
        # crates, removing the `solana-remote-wallet` -> `hidapi` ->
        # `libudev` chain that previously broke Android cross-builds.
        # This step regression-tests that property without relying on
        # downstream linking.
        run: |
          cargo check -p coins --target ${{ matrix.target }}

      - name: Rename staticlib to libkdf.a
        run: |
          mv target/${{ matrix.target }}/${{ inputs.profile }}/libmm2_bin_lib.a \
             target/${{ matrix.target }}/${{ inputs.profile }}/libkdf.a

      - name: Upload staticlib
        uses: actions/upload-artifact@v7
        with:
          name: libkdf-${{ matrix.ndk-abi }}
          path: target/${{ matrix.target }}/${{ inputs.profile }}/libkdf.a
