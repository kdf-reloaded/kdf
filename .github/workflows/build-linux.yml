name: Build Linux

# Linux x86_64 build, produced inside a pinned Debian 11 (glibc 2.31) container
# so the resulting binary runs on any host with glibc >= 2.31 (Debian 11/12,
# Ubuntu 20.04+, RHEL/Rocky 9, ...). Building on a newer base (e.g. the
# ubuntu-latest image, glibc 2.39) would raise the glibc floor and make the
# binary refuse to start on those still-common hosts.
#
# Both pipelines reuse this workflow via `workflow_call`, so BOTH the signed
# release builds (release.yml) AND the unsigned dev/staging snapshots
# (dev-build.yml) inherit the same low glibc floor and stay backwards-compatible.
#
# Also callable manually via workflow_dispatch. `profile` selects the cargo
# profile (release / dev).

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "cargo profile"
        required: false
        default: "release"
  workflow_call:
    inputs:
      profile:
        description: "cargo profile"
        required: false
        default: "release"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:11
    timeout-minutes: 120

    steps:
      # The debian:11 image is minimal: install everything the build needs.
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev protobuf-compiler cmake \
            clang libclang-dev git curl ca-certificates
          rm -rf /var/lib/apt/lists/*

      # The container runs as root; mark the checkout dir safe for git.
      - name: Trust workspace for git
        run: git config --global --add safe.directory '*'

      - uses: actions/checkout@v7

      # Install the toolchain via rustup; rust-toolchain.toml pins the version.
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Check Rust toolchain
        run: rustc --version && cargo --version

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-debian11-${{ inputs.profile }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            linux-debian11-${{ inputs.profile }}-

      - name: Build kdf
        run: cargo build --bin kdf --target x86_64-unknown-linux-gnu --profile ${{ inputs.profile }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: kdf-x86_64-unknown-linux-gnu
          path: target/x86_64-unknown-linux-gnu/${{ inputs.profile }}/kdf
