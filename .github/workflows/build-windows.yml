name: Build Windows

# P7.3 — Windows x86_64 build.
#
# Manually dispatched until a Windows runner is verified. Once green,
# flip the `on:` block to include `push` / `pull_request` triggers.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "cargo profile"
        required: false
        default: "release"
      features:
        description: "comma-separated cargo features"
        required: false
        default: ""
  workflow_call:
    inputs:
      profile:
        description: "cargo profile"
        required: false
        default: "release"
        type: string
      features:
        description: "comma-separated cargo features"
        required: false
        default: ""
        type: string

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - name: Install protoc
        shell: powershell
        run: choco install protoc -y

      # Rust toolchain (stable + x86_64-pc-windows-msvc) is preinstalled on
      # the GitHub-hosted windows-latest image.

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-${{ hashFiles('**/Cargo.lock') }}

      - name: Build kdf
        shell: powershell
        run: |
          cd mm2src
          if ("${{ inputs.features }}") {
            cargo build --bin kdf --target x86_64-pc-windows-msvc --profile ${{ inputs.profile }} --features ${{ inputs.features }}
          } else {
            cargo build --bin kdf --target x86_64-pc-windows-msvc --profile ${{ inputs.profile }}
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: kdf-x86_64-pc-windows-msvc
          path: target/x86_64-pc-windows-msvc/${{ inputs.profile }}/kdf.exe
