name: Build macOS

# P7.2 — macOS builds (x86_64, ARM64, Universal binary).
#
# Manually dispatched until a macOS runner is provisioned. Once wired up,
# flip the `on:` block to include `push` / `pull_request` triggers and
# optionally add signing secrets (APPLE_CERTIFICATE_BASE64, APPLE_ID,
# APPLE_APP_PASSWORD, APPLE_TEAM_ID) for notarization.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "cargo profile"
        required: false
        default: "release"
  workflow_call:
    inputs:
      profile:
        description: "cargo profile"
        required: false
        default: "release"
        type: string

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v7

      - name: Install protoc
        run: brew install protobuf

      - name: Install Rust toolchain for ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build kdf (${{ matrix.target }})
        run: cargo build --bin kdf --target ${{ matrix.target }} --profile ${{ inputs.profile }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: kdf-${{ matrix.target }}
          path: target/${{ matrix.target }}/${{ inputs.profile }}/kdf

  universal:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: kdf-x86_64-apple-darwin
          path: artifacts/x86_64

      - uses: actions/download-artifact@v8
        with:
          name: kdf-aarch64-apple-darwin
          path: artifacts/aarch64

      - name: Build universal binary via lipo
        run: |
          chmod +x artifacts/x86_64/kdf artifacts/aarch64/kdf
          mkdir -p dist
          lipo -create -output dist/kdf-universal \
            artifacts/x86_64/kdf \
            artifacts/aarch64/kdf
          lipo -info dist/kdf-universal

      - name: Upload universal binary
        uses: actions/upload-artifact@v7
        with:
          name: kdf-universal-apple-darwin
          path: dist/kdf-universal
