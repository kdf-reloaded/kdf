name: Tests

on:
  push:
    branches: [ reloaded-gplv2-base, dev, staging, main ]
  pull_request:
    branches: [ reloaded-gplv2-base, dev, staging, main ]

permissions:
  contents: read

# Supersede in-flight runs of the same workflow on the same ref so a fast
# follow-up push cancels the now-stale run instead of queuing behind it.
# If a push to the base branch ever needs to complete unconditionally,
# scope this group with `github.run_id` instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    # Cheap fast-feedback job. Keeps a fmt-only failure from forcing a
    # full unit-test rebuild on "Re-run failed jobs".
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install nightly rustfmt
        # rustfmt.toml uses nightly-only options (`unstable_features = true`,
        # `fn_single_line`, `imports_indent = "Visual"`,
        # `inline_attribute_width`, `overflow_delimited_expr`). Stable rustfmt
        # silently ignores them and produces a different shape, so the format
        # check below must run on nightly even though the build/test toolchain
        # is stable.
        #
        # The nightly is PINNED to a fixed date: rustfmt output drifts between
        # nightly releases, so a rolling `nightly` would make this check fail
        # spontaneously when an unrelated rustfmt change lands upstream. Bump
        # this date deliberately (and re-run `cargo +nightly-<date> fmt --all`)
        # when you want to adopt newer formatting.
        shell: bash
        run: rustup toolchain install nightly-2026-05-08 --profile minimal --component rustfmt --no-self-update

      - name: Check formatting
        # Run the pinned nightly rustfmt in check mode over the first-party
        # crates only.
        #
        # We deliberately do NOT use `cargo fmt --all`: it also descends into
        # the vendored `*-patched` trees, and `zcash_client_backend` declares
        # `pub mod compact_formats;` whose file is generated by that crate's
        # build script into a gitignored `src/proto/` directory. On a clean CI
        # checkout the file does not exist yet, so `cargo fmt --all` aborts
        # during module resolution ("failed to resolve mod `compact_formats`")
        # before formatting anything. rustfmt's `ignore` (set in rustfmt.toml)
        # cannot prevent this — it only suppresses output, not parsing — so we
        # instead select every workspace package whose manifest is not under a
        # `*-patched/` directory and format just those.
        #
        # The final `cargo fmt` is not piped, so its exit code (and full diff
        # on failure) is preserved for the runner log.
        shell: bash
        run: |
          pkgs=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.manifest_path | test("-patched/") | not) | .name')
          args=()
          for p in $pkgs; do args+=(-p "$p"); done
          cargo +nightly-2026-05-08 fmt "${args[@]}" -- --check

  clippy:
    # Cheap fast-feedback lint job, kept separate from unit-tests (same
    # rationale as `fmt`): a clippy-only failure must not force a full
    # unit-test rebuild on "Re-run failed jobs". It is NOT a prerequisite of
    # unit-tests for that reason — it compiles --all-targets, which is not
    # cheap, so gating the test jobs behind it would delay them.
    #
    # Invocation — we run, per first-party package, with DEFAULT features:
    #     cargo clippy -p <pkg>... --all-targets --no-deps -- -D warnings
    # and deliberately NOT the `--workspace --all-features` form that
    # docs/CODING_STANDARDS.md's hard rule used to spell out. Both deviations
    # are required and are documented in AGENTS.md §6:
    #   * `--workspace` fails outright: the vendored, patched
    #     rust-lightning-patched/lightning crate trips 13 deny-level clippy
    #     lints against its own source, so a bare workspace sweep never reaches
    #     our code. Selecting first-party packages with -p + `--no-deps` lints
    #     our own code and never clippy-invokes `lightning` as a primary target.
    #   * `--all-features` would turn on features that never ship in the `kdf`
    #     binary (mm2_main `regtest-netid`,
    #     `unsafe-rpc-wire-dump-release-override`, `custom-swap-locktime`) plus
    #     test-only Trezor-emulator / Foundry scaffolding, i.e. it would enforce
    #     -D warnings over code that never ships. Default features are what the
    #     `kdf` binary builds, so that is what we lint.
    # docs/CODING_STANDARDS.md has been reconciled to this invocation in the
    # same change that introduced this job.
    #
    # COVERAGE / honesty: package selection mirrors the `fmt` job (cargo
    # metadata + jq, excluding the vendored `*-patched/` trees) with two
    # ADDITIONAL exclusions — `lightning_persister` and
    # `lightning_background_processor`. Those are LDK (rust-lightning) companion
    # crates that live under mm2src/coins/ rather than under
    # rust-lightning-patched/ like their three siblings (`lightning`,
    # `lightning-invoice`, `lightning-net-tokio`), so the `-patched/` filter
    # misses them by location alone. They are vendored/adapted upstream code and
    # AGENTS.md §6 says not to turn clippy warnings in vendored trees into edits,
    # so they are out of scope for this gate. Their current (unenforced)
    # findings: lightning_persister — iter_overeager_cloned, unnecessary_sort_by,
    # permissions_set_readonly_false (all in test code); lightning_background_processor
    # — type_complexity. The location/filter inconsistency is tracked as a
    # follow-up (see docs/plans/clippy-ci-gate.md).
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Check Rust toolchain
        # First cargo/clippy call makes rustup install the pinned toolchain from
        # rust-toolchain.toml, which declares the `clippy` component, so no
        # explicit `rustup component add clippy` is needed.
        run: rustc --version && cargo --version && cargo clippy --version

      - name: Cache cargo registry and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            clippy-

      - name: cargo clippy (first-party, default features, -D warnings)
        shell: bash
        run: |
          # First-party packages, excluding the vendored *-patched/ trees and
          # the two LDK companion crates under coins/ (see job comment).
          pkgs=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[]
                | select(.manifest_path | test("-patched/") | not)
                | select(.manifest_path | test("/lightning_persister/|/lightning_background_processor/") | not)
                | .name')
          args=()
          for p in $pkgs; do args+=(-p "$p"); done
          cargo clippy "${args[@]}" --all-targets --no-deps -- -D warnings

  unit-tests:
    # One matrix cell per cargo invocation so "Re-run failed jobs" only
    # re-queues the cells that actually failed. Each cell is a fresh
    # GitHub-hosted runner, so a cargo cache (keyed on Cargo.lock) is
    # restored to keep the per-cell rebuild cost down.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: coins_activation
            cmd: cargo test -p coins_activation --lib
          - name: ordermatch
            cmd: cargo test -p mm2_main --lib ordermatch_tests
          - name: eth-utility
            cmd: cargo test -p coins --lib -- eth::eth_tests::test_addr_from_pubkey_str eth::eth_tests::test_gas_station_data eth::eth_tests::test_u256 eth::eth_tests::test_wei_from eth::eth_tests::test_wei_to
          - name: spv-validation
            cmd: cargo test -p kdf_spv_validation
          - name: rpc-response
            cmd: cargo test -p coins --lib rpc_response_tests
          # The shielded (ARRR/ZHTLC) store, scan and tree-state tests. Previously
          # unreachable from any matrix cell: the two `coins` cells above filter
          # to `eth::eth_tests::*` and `rpc_response_tests`, so nothing ran the
          # `z_coin` module and its regressions defended nothing in CI. See
          # docs/plans/librustzcash-upgrade.md and
          # docs/plans/arrr-ironwood-compatibility.md.
          - name: shielded
            cmd: "cargo test -p coins --lib z_coin::"
          # `scripted_node_ports` runs real EVM code against an in-process scripted
          # JSON-RPC node: deterministic, no binary, no network. Previously
          # unreachable from any cell (the `eth-utility` cell names five tests).
          # See docs/plans/evm-test-infrastructure.md.
          - name: eth-scripted-node
            cmd: "cargo test -p coins --lib eth::eth_tests::scripted_node_ports::"

    steps:
      - uses: actions/checkout@v7

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Check Rust toolchain
        run: rustc --version && cargo --version

      - name: Cache cargo registry and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-unit-${{ matrix.name }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            test-unit-${{ matrix.name }}-

      - name: ${{ matrix.name }}
        run: ${{ matrix.cmd }}

  # The wasm32 target is not reachable from `cargo check --workspace`, and the
  # crates below carry `#[cfg(target_arch = "wasm32")]` branches that nothing
  # else compiles. This is a compile check, not an artifact build: the
  # artifact-producing path lives in build-wasm.yml, which is dispatch- and
  # workflow_call-only.
  wasm32-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Add wasm32 target
        shell: bash
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm32-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo check -p coins (wasm32)
        shell: bash
        run: cargo check --target wasm32-unknown-unknown -p coins

      - name: cargo check -p coins_activation (wasm32)
        shell: bash
        run: cargo check --target wasm32-unknown-unknown -p coins_activation

      - name: cargo check -p mm2_db (wasm32)
        shell: bash
        run: cargo check --target wasm32-unknown-unknown -p mm2_db

      - name: cargo check -p mm2_main (wasm32)
        shell: bash
        run: cargo check --target wasm32-unknown-unknown -p mm2_main

  docker-tests:
    # GitHub-hosted Ubuntu runners ship Docker, so the integration suite
    # runs here without any self-hosted infrastructure. The standard runner
    # only has ~14 GB free, so we reclaim space before the heavy build and
    # container pulls (see "Free disk space" below).
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [fmt, unit-tests]

    steps:
      - uses: actions/checkout@v7

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Free disk space
        # The standard hosted runner has limited free disk; the docker_tests
        # build plus the testblockchain/qtumregtest images and the Rust
        # target dir can exhaust it. Remove preinstalled toolchains we do
        # not use to reclaim ~20 GB.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-}" || true
          df -h /

      - name: Cache cargo registry and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-docker-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            test-docker-

      - name: Check Docker availability
        run: docker --version && docker info --format '{{.ServerVersion}}'

      - name: Free required host ports
        # The previous version only warned on busy ports and only cleaned
        # containers matching the two known images, so a stale container
        # (or any other process) bound to e.g. :8000 caused testcontainers
        # to abort with `failed to bind host port 0.0.0.0:8000/tcp`.
        # Aggressively remove every container publishing one of the test
        # ports, then SIGKILL any remaining host process bound to them.
        run: |
          set -eu
          for port in 7000 8000 9000 10000; do
            stale=$(docker ps -q --filter "publish=$port" || true)
            if [ -n "$stale" ]; then
              echo "Removing containers publishing :$port: $stale"
              docker rm -f $stale || true
            fi
            pids=$(ss -tlnpH "sport = :$port" 2>/dev/null \
              | grep -oP 'pid=\K[0-9]+' | sort -u || true)
            if [ -n "$pids" ]; then
              echo "Killing host pids on :$port: $pids"
              kill -9 $pids || true
            fi
          done

      - name: Clean up stale test containers
        run: |
          docker rm -f $(docker ps -aq --filter ancestor=artempikulin/testblockchain:multiarch) 2>/dev/null || true
          docker rm -f $(docker ps -aq --filter ancestor=sergeyboyko/qtumregtest) 2>/dev/null || true

      - name: Ensure Zcash params are present
        # The artempikulin/testblockchain image bind-mounts ~/.zcash-params
        # into komodod. If any of the five params files is missing, komodod
        # aborts with "Cannot find the Zcash network parameters" and never
        # binds its RPC port, which causes wait_ready to hit its 120 s
        # assert and the entire docker_tests job to fail with exit 101.
        # Lazily fetch only what is missing so a fresh runner self-heals.
        run: |
          set -eu
          dir="$HOME/.zcash-params"
          mkdir -p "$dir"
          declare -A urls=(
            [sapling-spend.params]=https://download.z.cash/downloads/sapling-spend.params
            [sapling-output.params]=https://download.z.cash/downloads/sapling-output.params
            [sprout-groth16.params]=https://download.z.cash/downloads/sprout-groth16.params
            [sprout-verifying.key]=https://download.z.cash/downloads/sprout-verifying.key
            [sprout-proving.key]=https://download.z.cash/downloads/sprout-proving.key.deprecated-sworn-elves
          )
          for f in "${!urls[@]}"; do
            if [ ! -s "$dir/$f" ]; then
              echo "Fetching $f"
              curl -fL --retry 3 -o "$dir/$f" "${urls[$f]}"
            fi
          done
          ls -lh "$dir"

      - name: Run UTXO docker tests
        # Passphrases are generated fresh per run by the wrapper. The docker
        # harness funds the addresses derived from them dynamically on a
        # private regtest chain, so no fixed seed is needed and none is
        # committed. See scripts/with-test-passphrases.sh and
        # docs/TEST_ENV_VARS.md.
        run: scripts/with-test-passphrases.sh cargo test --bin docker_tests --features regtest-netid -- --test-threads=1 test_search_for_swap_tx_spend test_one_hundred_maker_payments test_withdraw test_utxo_merge test_send_and_validate test_validate_maker_payment_wrong_amount test_list_unspent test_multiple_sequential
        env:
          RUST_LOG: debug
          
      - name: Upload mm2 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mm2-logs-${{ github.run_id }}-${{ github.job }}
          path: |
            /tmp/mm2_*/mm2.log
            /tmp/mm2_*/**/mm2.log
          if-no-files-found: warn
          retention-days: 7

  trezor-emulator-tests:
    # Trezor hardware-wallet signing tests run against the official
    # trezor-user-env emulator (Docker, host networking) so no physical
    # device is required. The emulator speaks the Trezor v1 wire protocol
    # over UDP :21324 and exposes a controller WebSocket on :9001 (+ a
    # DebugLink on :21325 used to auto-confirm on-device prompts); the tests
    # drive it via mm2src/trezor/tests/emulator/emulator_control.py
    # (python3 + websockets). Everything is gated behind the
    # `trezor-emulator-tests` cargo feature and the TREZOR_EMULATOR_UDP env
    # var, so the ordinary unit/docker jobs never build or run it.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [fmt, unit-tests]

    steps:
      - uses: actions/checkout@v7

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install python websockets (emulator controller client)
        # emulator_control.py talks to the trezor-user-env controller over a
        # WebSocket. Prefer the distro package; fall back to pip with
        # --break-system-packages for PEP 668 environments.
        run: |
          python3 --version
          sudo apt-get install -y python3-websockets \
            || python3 -m pip install --user --break-system-packages websockets

      - name: Cache cargo registry and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-trezor-emu-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            test-trezor-emu-

      - name: Check Docker availability
        run: docker --version && docker info --format '{{.ServerVersion}}'

      - name: Start Trezor emulator (trezor-user-env)
        run: |
          docker rm -f tenv 2>/dev/null || true
          docker run -d --name tenv --network host \
            ghcr.io/trezor/trezor-user-env:latest
          # Wait for the controller dashboard to answer before starting tests.
          for i in $(seq 1 90); do
            if curl -s -o /dev/null http://localhost:9002; then
              echo "trezor-user-env up after ${i}s"; break
            fi
            sleep 1
          done

      - name: Run Trezor emulator acceptance tests
        # Serialize (single emulated device). The suites seed the device
        # themselves via emulator_control.py and restore clean SLIP-14 state.
        env:
          TREZOR_EMULATOR_UDP: 127.0.0.1:21324
        run: |
          set -e
          # Low-level trezor-crate smoke test: get address + sign a legacy tx.
          cargo test -p trezor --features trezor-emulator-tests \
            --test emulator_eth -- --nocapture --test-threads=1
          # EVM Trezor withdraw acceptance suite: native / ERC20 / user-action /
          # error discriminants (ch. 50 T50.*).
          cargo test -p coins --features trezor-emulator-tests \
            eth_trezor_emulator -- --nocapture --test-threads=1

      - name: Emulator logs
        if: always()
        run: docker logs tenv 2>&1 | tail -200 || true

      - name: Stop emulator
        if: always()
        run: docker rm -f tenv || true

  external-network-tests:
    # Allow-to-fail job for tests that depend on live external endpoints
    # outside our control (cipig DOC/MARTY electrums, the public ETH dev
    # chain at 195.201.0.6:8565, etc.). They are `#[ignore]` in source so
    # they are skipped by `cargo test` everywhere else — including the
    # `docker-tests` job, where their old RICK/MORTY substring would
    # otherwise be picked up by the `test_withdraw` libtest filter and
    # bring the whole pipeline down whenever the upstream services move
    # or go offline. Run them here on a best-effort basis.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: fmt
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Check Rust toolchain
        run: rustc --version && cargo --version

      - name: Cache cargo registry and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-extnet-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            test-extnet-

      - name: Run withdraw integration tests against DOC/MARTY
        # The two `test_withdraw_and_send` / `test_withdraw_legacy` tests
        # live in `mm2_main::mm2_tests` and are only compiled into the
        # `docker_tests` test binary (the lib has `test = false`). They
        # are `#[ignore]`d so the docker-tests job's substring filter no
        # longer picks them up; here we run them explicitly with
        # `--include-ignored --exact`.
        #
        # `_MM2_TEST_CONF=1` short-circuits the `docker_tests_runner`
        # container bring-up (MYCOIN/MYCOIN1/qtum/for_slp), which these
        # two tests do not need — they spawn their own MarketMaker and
        # talk to public cipig electrums + the public ETH dev chain.
        # `continue-on-error` mirrors the job-level setting so the step's
        # status is preserved even when the upstream services are flaky.
        continue-on-error: true
        run: |
          cargo test --bin docker_tests --features regtest-netid -- \
            --test-threads=1 --include-ignored --exact \
            mm2::mm2_tests::test_withdraw_and_send \
            mm2::mm2_tests::test_withdraw_legacy
        env:
          RUST_LOG: debug
          _MM2_TEST_CONF: "1"
          # These tests withdraw from PRE-FUNDED DOC/MARTY testnet addresses, so
          # the seed must be the specific funded one — do NOT randomise these via
          # scripts/with-test-passphrases.sh. They are well-known public testnet
          # seeds (no mainnet funds), safe to keep fixed. See docs/TEST_ENV_VARS.md.
          BOB_PASSPHRASE: "also shoot benefit prefer juice shell elder veteran woman mimic image kidney"
          ALICE_PASSPHRASE: "spice describe gravity federal blast come thank unfair canal monkey style afraid"

      - name: Run Polygon check_if_my_payment_sent against a live RPC
        # Read-only Polygon mainnet test. It verifies check_if_my_payment_sent
        # both finds a known 2021 payment (fixed historical block) and returns
        # None for a recent window. It is NOT #[ignore]d: it skips itself when
        # POLYGON_RPC_URL is unset, so it is a no-op in every other job and only
        # actually runs here, where the secret is provided. A free-tier archive
        # RPC (Ankr/Alchemy) is sufficient — no funds and no writes. When the
        # secret is absent (e.g. on forks) the test skips and this step passes.
        # See docs/TEST_ENV_VARS.md.
        continue-on-error: true
        run: cargo test -p coins --lib polygon_check_if_my_payment_sent -- --nocapture
        env:
          RUST_LOG: debug
          POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL }}

      - name: Upload mm2 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mm2-logs-${{ github.run_id }}-${{ github.job }}
          path: |
            /tmp/mm2_*/mm2.log
            /tmp/mm2_*/**/mm2.log
          if-no-files-found: warn
          retention-days: 7

  evm-geth-tests:
    # Send / refund / withdraw against a real local chain (`geth --dev`), driven
    # by mm2_test_helpers::geth_dev. A separate job rather than a unit-tests
    # matrix cell because it needs a service binary the other cells do not, and
    # because a failure here must be diagnosable as "the EVM path broke" and not
    # lost among the matrix legs' command-named contexts.
    #
    # THE TRAP: GethDev::start() returns None when geth is missing or will not
    # start, and the tests then log "skipping" and PASS. Two independent guards
    # make that impossible here:
    #   1. the install step verifies the pinned checksum and `geth version`, so a
    #      missing or wrong binary fails at setup;
    #   2. KDF_REQUIRE_GETH=1 makes the harness itself panic instead of returning
    #      None, so a geth that is present but will not come up also fails the
    #      test. (Keep this variable if you copy the job.)
    # The run step additionally asserts the expected number of tests actually ran,
    # because a filter that matches nothing also "passes".
    #
    # Deliberately not here: `test_withdraw_and_send` (mm2_main). It is #[ignore]d
    # because its DOC/MARTY half needs live cipig electrums; only its ETH/JST half
    # uses geth. It stays in external-network-tests.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: fmt
    env:
      KDF_REQUIRE_GETH: "1"
      # Pinned: a node that changes between runs is a flake source. Bump the
      # version, build id and checksum together, deliberately. The checksum is of
      # the release tarball from the official go-ethereum build store
      # (gethstore.blob.core.windows.net), where go-ethereum's own download page
      # points. The tarball is cached (see the restore step); with a cold cache and
      # an unreachable store the job fails at install, by design.
      GETH_VERSION: "1.17.2"
      GETH_BUILD: "be4dc0c4"
      GETH_TARBALL_SHA256: "74c83a10f64a8d4c2dbc936bc2088f574d95005d0bf35641ffb092fc39bb968c"

    steps:
      - uses: actions/checkout@v7

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Restore cached geth tarball
        # Closes the job's one third-party dependency: with a warm cache the
        # download store is not contacted at all. The key carries the version,
        # build id AND the SHA-256, so bumping any of the three misses and can
        # never hand back a different artifact. A hit is not trusted: the next
        # step verifies the checksum on both paths. A miss is not an error; the
        # tarball is downloaded, verified and saved by this step's post action.
        # (If an entry is ever found corrupt the verify step fails the job; delete
        # that cache entry to refresh it, cache keys are immutable.)
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/geth-dl
          key: geth-tarball-${{ env.GETH_VERSION }}-${{ env.GETH_BUILD }}-${{ env.GETH_TARBALL_SHA256 }}

      - name: Install and verify pinned geth
        shell: bash
        run: |
          set -euo pipefail
          name="geth-linux-amd64-${GETH_VERSION}-${GETH_BUILD}"
          tgz="$RUNNER_TEMP/geth-dl/geth.tgz"
          mkdir -p "$RUNNER_TEMP/geth-dl"
          if [ -s "$tgz" ]; then
            echo "using cached geth tarball"
          else
            curl -fsSL --retry 3 -o "$tgz" \
              "https://gethstore.blob.core.windows.net/builds/${name}.tar.gz"
          fi
          # Runs on a cache hit and on a fresh download alike.
          echo "${GETH_TARBALL_SHA256}  $tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/geth-bin"
          tar -xzf "$tgz" -C "$RUNNER_TEMP/geth-bin" --strip-components=1 "${name}/geth"
          echo "$RUNNER_TEMP/geth-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/geth-bin/geth" version | tee "$RUNNER_TEMP/geth-version.txt"
          grep -q "^Version: ${GETH_VERSION}-" "$RUNNER_TEMP/geth-version.txt"

      - name: Check Rust toolchain
        run: rustc --version && cargo --version

      - name: Cache cargo registry and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-evm-geth-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            test-evm-geth-

      - name: Run eth_swap_dev_tests against geth --dev
        shell: bash
        run: |
          set -euo pipefail
          geth version
          cargo test -p coins --lib eth::eth_swap_dev_tests:: -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/evm-geth.log"
          # A filter that matches nothing, or tests that skipped, must not pass.
          grep -q "test result: ok. 3 passed; 0 failed" "$RUNNER_TEMP/evm-geth.log"
          if grep -qi "skipping" "$RUNNER_TEMP/evm-geth.log"; then
            echo "::error::a geth test reported skipping"; exit 1
          fi

  tests-passed:
    # The single required status check for dev, staging and main. Branch
    # protection pins this one stable context name instead of the individual
    # jobs: the unit-tests matrix legs are named after their commands, so
    # pinning them would mean the next edit to a matrix command silently renames
    # a required check, and every PR afterwards hangs on "Expected -- waiting for
    # status to be reported". A future test job is made required by adding it
    # to `needs:` below, not by changing repository settings; that indirection
    # is the point of this job.
    #
    # THE TRAP this job guards against: a job whose `needs:` dependency fails is
    # SKIPPED, not failed, and a skipped job counts as passing for a required
    # status check. Written naively, this job would turn a red lint or test run
    # into a green gate. So it runs `if: always()` and then asserts explicitly
    # that every dependency's result is exactly `success`; failure, cancelled,
    # skipped and any other result all fail it. `if: always()` also means it
    # runs (and fails) in a cancelled run instead of being skipped.
    #
    # evm-geth-tests is in `needs:` because it is deterministic given the commit:
    # a local `geth --dev` chain, a pinned and checksummed binary, and a harness
    # that fails rather than skips when the node is absent (KDF_REQUIRE_GETH).
    # Its one third-party dependency is the one-time geth download at install.
    #
    # Deliberately NOT in `needs:`: docker-tests and trezor-emulator-tests depend
    # on third-party availability (Docker Hub images, the trezor-user-env
    # emulator stack), and external-network-tests runs against live networks and
    # is `continue-on-error` by design. A required check must be deterministic
    # given the commit and independent of third-party uptime, or people learn to
    # bypass the rule. They are phase-2 candidates once there is reliability
    # data for them.
    if: always()
    needs: [fmt, clippy, unit-tests, wasm32-check, evm-geth-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Assert every dependency succeeded
        # `needs` arrives through the environment, not spliced into the script,
        # and is printed in full so a red run is diagnosable from this log alone.
        # `unit-tests` is a matrix; its result is `failure` if any leg failed.
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        shell: bash
        run: |
          echo "$NEEDS_JSON"
          bad=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<< "$NEEDS_JSON")
          if [ -n "$bad" ]; then
            echo "::error::required jobs did not succeed: $(echo $bad)"
            exit 1
          fi
          echo "all required jobs succeeded"
