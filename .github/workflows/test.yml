name: Tests

on:
  push:
    branches: [ reloaded-gplv2-base, dev ]
  pull_request:
    branches: [ reloaded-gplv2-base, dev ]

# Supersede in-flight runs of the same workflow on the same ref so a fast
# follow-up push cancels the now-stale run instead of queuing behind it.
# If a push to the base branch ever needs to complete unconditionally,
# scope this group with `github.run_id` instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    # Cheap fast-feedback job. Keeps a fmt-only failure from forcing a
    # full unit-test rebuild on "Re-run failed jobs".
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install nightly rustfmt
        # rustfmt.toml uses nightly-only options (`unstable_features = true`,
        # `fn_single_line`, `imports_indent = "Visual"`,
        # `inline_attribute_width`, `overflow_delimited_expr`). Stable rustfmt
        # silently ignores them and produces a different shape, so the format
        # check below must run on nightly even though the build/test toolchain
        # is stable.
        #
        # The nightly is PINNED to a fixed date: rustfmt output drifts between
        # nightly releases, so a rolling `nightly` would make this check fail
        # spontaneously when an unrelated rustfmt change lands upstream. Bump
        # this date deliberately (and re-run `cargo +nightly-<date> fmt --all`)
        # when you want to adopt newer formatting.
        shell: bash
        run: rustup toolchain install nightly-2026-05-08 --profile minimal --component rustfmt --no-self-update

      - name: Check formatting
        # Run the pinned nightly rustfmt in check mode over the first-party
        # crates only.
        #
        # We deliberately do NOT use `cargo fmt --all`: it also descends into
        # the vendored `*-patched` trees, and `zcash_client_backend` declares
        # `pub mod compact_formats;` whose file is generated by that crate's
        # build script into a gitignored `src/proto/` directory. On a clean CI
        # checkout the file does not exist yet, so `cargo fmt --all` aborts
        # during module resolution ("failed to resolve mod `compact_formats`")
        # before formatting anything. rustfmt's `ignore` (set in rustfmt.toml)
        # cannot prevent this — it only suppresses output, not parsing — so we
        # instead select every workspace package whose manifest is not under a
        # `*-patched/` directory and format just those.
        #
        # The final `cargo fmt` is not piped, so its exit code (and full diff
        # on failure) is preserved for the runner log.
        shell: bash
        run: |
          pkgs=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.manifest_path | test("-patched/") | not) | .name')
          args=()
          for p in $pkgs; do args+=(-p "$p"); done
          cargo +nightly-2026-05-08 fmt "${args[@]}" -- --check

  unit-tests:
    # One matrix cell per cargo invocation so "Re-run failed jobs" only
    # re-queues the cells that actually failed. Each cell is a fresh
    # GitHub-hosted runner, so a cargo cache (keyed on Cargo.lock) is
    # restored to keep the per-cell rebuild cost down.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: coins_activation
            cmd: cargo test -p coins_activation --lib
          - name: ordermatch
            cmd: cargo test -p mm2_main --lib ordermatch_tests
          - name: eth-utility
            cmd: cargo test -p coins --lib -- eth::eth_tests::test_addr_from_pubkey_str eth::eth_tests::test_gas_station_data eth::eth_tests::test_u256 eth::eth_tests::test_wei_from eth::eth_tests::test_wei_to
          - name: spv-validation
            cmd: cargo test -p kdf_spv_validation
          - name: rpc-response
            cmd: cargo test -p coins --lib rpc_response_tests

    steps:
      - uses: actions/checkout@v7

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Check Rust toolchain
        run: rustc --version && cargo --version

      - name: Cache cargo registry and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-unit-${{ matrix.name }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            test-unit-${{ matrix.name }}-

      - name: ${{ matrix.name }}
        run: ${{ matrix.cmd }}

  docker-tests:
    # GitHub-hosted Ubuntu runners ship Docker, so the integration suite
    # runs here without any self-hosted infrastructure. The standard runner
    # only has ~14 GB free, so we reclaim space before the heavy build and
    # container pulls (see "Free disk space" below).
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [fmt, unit-tests]

    steps:
      - uses: actions/checkout@v7

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Free disk space
        # The standard hosted runner has limited free disk; the docker_tests
        # build plus the testblockchain/qtumregtest images and the Rust
        # target dir can exhaust it. Remove preinstalled toolchains we do
        # not use to reclaim ~20 GB.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-}" || true
          df -h /

      - name: Cache cargo registry and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-docker-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            test-docker-

      - name: Check Docker availability
        run: docker --version && docker info --format '{{.ServerVersion}}'

      - name: Free required host ports
        # The previous version only warned on busy ports and only cleaned
        # containers matching the two known images, so a stale container
        # (or any other process) bound to e.g. :8000 caused testcontainers
        # to abort with `failed to bind host port 0.0.0.0:8000/tcp`.
        # Aggressively remove every container publishing one of the test
        # ports, then SIGKILL any remaining host process bound to them.
        run: |
          set -eu
          for port in 7000 8000 9000 10000; do
            stale=$(docker ps -q --filter "publish=$port" || true)
            if [ -n "$stale" ]; then
              echo "Removing containers publishing :$port: $stale"
              docker rm -f $stale || true
            fi
            pids=$(ss -tlnpH "sport = :$port" 2>/dev/null \
              | grep -oP 'pid=\K[0-9]+' | sort -u || true)
            if [ -n "$pids" ]; then
              echo "Killing host pids on :$port: $pids"
              kill -9 $pids || true
            fi
          done

      - name: Clean up stale test containers
        run: |
          docker rm -f $(docker ps -aq --filter ancestor=artempikulin/testblockchain:multiarch) 2>/dev/null || true
          docker rm -f $(docker ps -aq --filter ancestor=sergeyboyko/qtumregtest) 2>/dev/null || true

      - name: Ensure Zcash params are present
        # The artempikulin/testblockchain image bind-mounts ~/.zcash-params
        # into komodod. If any of the five params files is missing, komodod
        # aborts with "Cannot find the Zcash network parameters" and never
        # binds its RPC port, which causes wait_ready to hit its 120 s
        # assert and the entire docker_tests job to fail with exit 101.
        # Lazily fetch only what is missing so a fresh runner self-heals.
        run: |
          set -eu
          dir="$HOME/.zcash-params"
          mkdir -p "$dir"
          declare -A urls=(
            [sapling-spend.params]=https://download.z.cash/downloads/sapling-spend.params
            [sapling-output.params]=https://download.z.cash/downloads/sapling-output.params
            [sprout-groth16.params]=https://download.z.cash/downloads/sprout-groth16.params
            [sprout-verifying.key]=https://download.z.cash/downloads/sprout-verifying.key
            [sprout-proving.key]=https://download.z.cash/downloads/sprout-proving.key.deprecated-sworn-elves
          )
          for f in "${!urls[@]}"; do
            if [ ! -s "$dir/$f" ]; then
              echo "Fetching $f"
              curl -fL --retry 3 -o "$dir/$f" "${urls[$f]}"
            fi
          done
          ls -lh "$dir"

      - name: Run UTXO docker tests
        # Passphrases are generated fresh per run by the wrapper. The docker
        # harness funds the addresses derived from them dynamically on a
        # private regtest chain, so no fixed seed is needed and none is
        # committed. See scripts/with-test-passphrases.sh and
        # docs/TEST_ENV_VARS.md.
        run: scripts/with-test-passphrases.sh cargo test --bin docker_tests --features regtest-netid -- --test-threads=1 test_search_for_swap_tx_spend test_one_hundred_maker_payments test_withdraw test_utxo_merge test_send_and_validate test_validate_maker_payment_wrong_amount test_list_unspent test_multiple_sequential
        env:
          RUST_LOG: debug
          
      - name: Upload mm2 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mm2-logs-${{ github.run_id }}-${{ github.job }}
          path: |
            /tmp/mm2_*/mm2.log
            /tmp/mm2_*/**/mm2.log
          if-no-files-found: warn
          retention-days: 7

  trezor-emulator-tests:
    # Trezor hardware-wallet signing tests run against the official
    # trezor-user-env emulator (Docker, host networking) so no physical
    # device is required. The emulator speaks the Trezor v1 wire protocol
    # over UDP :21324 and exposes a controller WebSocket on :9001 (+ a
    # DebugLink on :21325 used to auto-confirm on-device prompts); the tests
    # drive it via mm2src/trezor/tests/emulator/emulator_control.py
    # (python3 + websockets). Everything is gated behind the
    # `trezor-emulator-tests` cargo feature and the TREZOR_EMULATOR_UDP env
    # var, so the ordinary unit/docker jobs never build or run it.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [fmt, unit-tests]

    steps:
      - uses: actions/checkout@v7

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install python websockets (emulator controller client)
        # emulator_control.py talks to the trezor-user-env controller over a
        # WebSocket. Prefer the distro package; fall back to pip with
        # --break-system-packages for PEP 668 environments.
        run: |
          python3 --version
          sudo apt-get install -y python3-websockets \
            || python3 -m pip install --user --break-system-packages websockets

      - name: Cache cargo registry and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-trezor-emu-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            test-trezor-emu-

      - name: Check Docker availability
        run: docker --version && docker info --format '{{.ServerVersion}}'

      - name: Start Trezor emulator (trezor-user-env)
        run: |
          docker rm -f tenv 2>/dev/null || true
          docker run -d --name tenv --network host \
            ghcr.io/trezor/trezor-user-env:latest
          # Wait for the controller dashboard to answer before starting tests.
          for i in $(seq 1 90); do
            if curl -s -o /dev/null http://localhost:9002; then
              echo "trezor-user-env up after ${i}s"; break
            fi
            sleep 1
          done

      - name: Run Trezor emulator acceptance tests
        # Serialize (single emulated device). The suites seed the device
        # themselves via emulator_control.py and restore clean SLIP-14 state.
        env:
          TREZOR_EMULATOR_UDP: 127.0.0.1:21324
        run: |
          set -e
          # Low-level trezor-crate smoke test: get address + sign a legacy tx.
          cargo test -p trezor --features trezor-emulator-tests \
            --test emulator_eth -- --nocapture --test-threads=1
          # EVM Trezor withdraw acceptance suite: native / ERC20 / user-action /
          # error discriminants (ch. 50 T50.*).
          cargo test -p coins --features trezor-emulator-tests \
            eth_trezor_emulator -- --nocapture --test-threads=1

      - name: Emulator logs
        if: always()
        run: docker logs tenv 2>&1 | tail -200 || true

      - name: Stop emulator
        if: always()
        run: docker rm -f tenv || true

  external-network-tests:
    # Allow-to-fail job for tests that depend on live external endpoints
    # outside our control (cipig DOC/MARTY electrums, the public ETH dev
    # chain at 195.201.0.6:8565, etc.). They are `#[ignore]` in source so
    # they are skipped by `cargo test` everywhere else — including the
    # `docker-tests` job, where their old RICK/MORTY substring would
    # otherwise be picked up by the `test_withdraw` libtest filter and
    # bring the whole pipeline down whenever the upstream services move
    # or go offline. Run them here on a best-effort basis.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: fmt
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Check Rust toolchain
        run: rustc --version && cargo --version

      - name: Cache cargo registry and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-extnet-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            test-extnet-

      - name: Run withdraw integration tests against DOC/MARTY
        # The two `test_withdraw_and_send` / `test_withdraw_legacy` tests
        # live in `mm2_main::mm2_tests` and are only compiled into the
        # `docker_tests` test binary (the lib has `test = false`). They
        # are `#[ignore]`d so the docker-tests job's substring filter no
        # longer picks them up; here we run them explicitly with
        # `--include-ignored --exact`.
        #
        # `_MM2_TEST_CONF=1` short-circuits the `docker_tests_runner`
        # container bring-up (MYCOIN/MYCOIN1/qtum/for_slp), which these
        # two tests do not need — they spawn their own MarketMaker and
        # talk to public cipig electrums + the public ETH dev chain.
        # `continue-on-error` mirrors the job-level setting so the step's
        # status is preserved even when the upstream services are flaky.
        continue-on-error: true
        run: |
          cargo test --bin docker_tests --features regtest-netid -- \
            --test-threads=1 --include-ignored --exact \
            mm2::mm2_tests::test_withdraw_and_send \
            mm2::mm2_tests::test_withdraw_legacy
        env:
          RUST_LOG: debug
          _MM2_TEST_CONF: "1"
          # These tests withdraw from PRE-FUNDED DOC/MARTY testnet addresses, so
          # the seed must be the specific funded one — do NOT randomise these via
          # scripts/with-test-passphrases.sh. They are well-known public testnet
          # seeds (no mainnet funds), safe to keep fixed. See docs/TEST_ENV_VARS.md.
          BOB_PASSPHRASE: "also shoot benefit prefer juice shell elder veteran woman mimic image kidney"
          ALICE_PASSPHRASE: "spice describe gravity federal blast come thank unfair canal monkey style afraid"

      - name: Upload mm2 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mm2-logs-${{ github.run_id }}-${{ github.job }}
          path: |
            /tmp/mm2_*/mm2.log
            /tmp/mm2_*/**/mm2.log
          if-no-files-found: warn
          retention-days: 7