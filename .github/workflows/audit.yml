name: Security Audit

on:
  push:
    branches: [ reloaded-gplv2-base, dev ]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/audit.yml'
  pull_request:
    branches: [ reloaded-gplv2-base, dev ]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/audit.yml'
  # Weekly run so a freshly published advisory against an already-pinned
  # dependency is surfaced even without a dependency change.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  advisories:
    # Fails only on vulnerability / unsound advisories that are NOT in
    # deny.toml's accepted `ignore` list. The accepted advisories (libp2p 0.52
    # fork TLS/net stack, Solana SDK, WalletConnect, vendored zcash), the
    # scheduled reloaded-owned migrations (rusqlite, metrics) and the accepted
    # transitive unsound advisories are documented with per-advisory rationale
    # in deny.toml; see docs/reloaded-rewrite/28-libp2p-modernization.md (OQ2)
    # for the libp2p residue. A newly disclosed advisory outside that list
    # turns this job red.
    #
    # deny.toml uses cargo-deny schema v2, so cargo-deny is pinned to a known
    # version rather than floating (a floating minor could change the config
    # schema and break the parse, as the pre-0.16 -> v2 migration did).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-deny (pinned)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.9
      - name: cargo-deny (advisories)
        run: cargo deny check advisories

  # cargo-deny reads the RustSec advisory database. The GitHub Advisory Database is
  # a superset of it, and the gap is not theoretical: on 2026-09-23 five open alerts
  # against the root lockfile -- including two remotely reachable gossipsub panics
  # (GHSA-gc42-3jg7-rxr2, GHSA-xqmp-fxgv-xvq5) and a yamux one -- had no RUSTSEC id
  # at all, so `cargo deny check advisories` printed `advisories ok` while a remote
  # crash sat in the tree.
  #
  # This job closes that gap by reading Dependabot's own findings. It only considers
  # the root `Cargo.lock`, which is the lockfile the shipped binaries resolve from;
  # vendor-patch and orphan lockfiles are Dependabot noise, not build inputs. The
  # accept mechanism here is *dismissing* the alert on the Security tab (with a
  # reason and a justification), the same way deny.toml's `ignore` list is the accept
  # mechanism for the cargo-deny job -- a dismissed alert is no longer "open".
  dependabot-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Open Dependabot alerts against the root lockfile
        env:
          # The default GITHUB_TOKEN CANNOT read the Dependabot alerts API -- it
          # returns 403 "Resource not accessible by integration" and there is no
          # `permissions:` key that grants it. Reading alerts needs a PAT (or a
          # GitHub App token) with `security_events` / `dependabot_alerts: read`.
          #
          # ONE-TIME SETUP: add a repo secret named DEPENDABOT_ALERTS_TOKEN. Until
          # that exists this job warns and passes rather than failing, so the gate
          # is inert but nothing is broken -- see the 403 branch below.
          GH_TOKEN: ${{ secrets.DEPENDABOT_ALERTS_TOKEN || secrets.GITHUB_TOKEN }}
          # Dependabot alert state is a property of the repository, derived from
          # the DEFAULT branch -- there is no per-ref view. A PR that fixes an
          # alert therefore cannot close it until it merges, so failing this job
          # on `pull_request` would mark every such PR red for the thing it is
          # fixing. Report there, enforce on the default branch.
          ENFORCE: ${{ github.event_name != 'pull_request' }}
        run: |
          set -uo pipefail
          if ! alerts=$(gh api --paginate \
                "/repos/${{ github.repository }}/dependabot/alerts?state=open&per_page=100" \
                --jq '.[] | select(.dependency.manifest_path == "Cargo.lock")
                          | "\(.security_advisory.severity)\t\(.dependency.package.name)\t\(.security_advisory.ghsa_id)\t\(.security_advisory.summary)"' \
                2>&1); then
            printf '%s\n' "$alerts"
            if printf '%s' "$alerts" | grep -qiE 'not accessible by integration|HTTP 403'; then
              echo "::warning::dependabot-alerts is INERT: this token cannot read the Dependabot alerts API. Add a DEPENDABOT_ALERTS_TOKEN repo secret (a PAT with dependabot_alerts/security_events read) to arm it. See docs/plans/dependabot-triage-2026-09.md."
              exit 0
            fi
            echo "::error::Could not query the Dependabot alerts API."
            exit 1
          fi

          if [ -z "$alerts" ]; then
            echo "No open Dependabot alerts against the root Cargo.lock."
            exit 0
          fi

          printf '%s\n' "$alerts"
          echo
          echo "Fix the dependency, or dismiss the alert on the Security tab with a"
          echo "reason and a written justification, and record that rationale in deny.toml."
          if [ "$ENFORCE" = "true" ]; then
            echo "::error::Open Dependabot alerts against the root Cargo.lock (see above)."
            exit 1
          fi
          # Workflow commands must be a single line.
          echo "::warning::Open Dependabot alerts against the root Cargo.lock (see the job log). Not failing the PR: alert state follows the default branch, so a fix on this branch cannot close them until it merges."
