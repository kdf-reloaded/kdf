name: Dev Build (all platforms)

# Unsigned dev/staging snapshot builds — MANUAL only (workflow_dispatch).
#
# Use the "Run workflow" button to produce a downloadable, unsigned binary set
# from whatever ref you pick. These are disposable snapshots: not checksummed,
# not signed, and not published as a GitHub Release. Signed, public releases are
# cut only from `main` `v*` tags via release.yml.
#
# Each platform job delegates to its dedicated per-platform workflow via
# `workflow_call`. Linux reuses build-linux.yml, which builds inside a Debian 11
# container (glibc 2.31) so even dev snapshots stay broadly backwards-compatible.
# If a downstream job fails (missing runner, toolchain, etc.) the others still
# complete and upload their artifacts.

on:
  workflow_dispatch:

jobs:
  linux:
    uses: ./.github/workflows/build-linux.yml
    with:
      profile: release

  macos:
    uses: ./.github/workflows/build-macos.yml
    with:
      profile: release

  windows:
    uses: ./.github/workflows/build-windows.yml
    with:
      profile: release

  ios:
    uses: ./.github/workflows/build-ios.yml
    with:
      profile: release

  android:
    uses: ./.github/workflows/build-android.yml
    with:
      profile: release

  wasm:
    uses: ./.github/workflows/build-wasm.yml
    with:
      profile: dev
