[package]
edition = "2024"
rust-version = "1.85.1"
name = "zcash_transparent"
version = "0.8.0"
authors = [
    "Jack Grigg <jack@electriccoin.co>",
    "Kris Nuttycombe <kris@electriccoin.co>",
    "Daira-Emma Hopwood <daira@electriccoin.co>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Rust implementations of the Zcash transparent protocol"
readme = "README.md"
categories = ["cryptography::cryptocurrencies"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/zcash/librustzcash"
resolver = "2"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
default = ["std"]
std = [
    "dep:document-features",
    "secp256k1?/std",
    "zcash_address/std",
    "zcash_script/std",
]
test-dependencies = [
    "dep:proptest",
    "zcash_protocol/test-dependencies",
]
transparent-inputs = [
    "bip32/secp256k1-ffi",
    "dep:secp256k1",
]

[lib]
name = "zcash_transparent"
path = "src/lib.rs"

[dependencies.bip32]
