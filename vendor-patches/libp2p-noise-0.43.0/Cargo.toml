# VENDOR PATCH of libp2p-noise 0.43.0, taken verbatim from
# KomodoPlatform/rust-libp2p tag k-0.52.12 (commit 8bcc1fda). Only this manifest
# is patched: `x25519-dalek` 1.1 -> 2 and `curve25519-dalek` 3 -> 4.1.1, as
# upstream libp2p-noise 0.43.2 has them -- RUSTSEC-2024-0344. See PATCH-NOTES.md.
#
# The fork declares libp2p-core, libp2p-identity, multiaddr, multihash and
# quickcheck via `[workspace.dependencies]`; vendored here as explicit git deps on
# the SAME fork tag (fork crates) or the fork's own registry requirements, so
# Cargo unifies them with the copies the root libp2p pin resolves.
[package]
name = "libp2p-noise"
edition = "2021"
rust-version = "1.65.0"
description = "Cryptographic handshake protocol using the noise framework."
version = "0.43.0"
authors = ["Parity Technologies <admin@parity.io>"]
license = "MIT"
repository = "https://github.com/libp2p/rust-libp2p"

[dependencies]
bytes = "1"
curve25519-dalek = "4.1.1"
futures = "0.3.28"
libp2p-core = { git = "https://github.com/KomodoPlatform/rust-libp2p.git", tag = "k-0.52.12" }
libp2p-identity = { version = "0.2.1", features = ["ed25519"] }
log = "0.4"
multiaddr = "0.18.0"
multihash = "0.19.0"
once_cell = "1.18.0"
quick-protobuf = "0.8"
rand = "0.8.3"
sha2 = "0.10.7"
static_assertions = "1"
thiserror = "1.0.40"
x25519-dalek = "2"
zeroize = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
snow = { version = "0.9.2", features = ["ring-resolver"], default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
snow = { version = "0.9.2", features = ["default-resolver"], default-features = false }

[dev-dependencies]
env_logger = "0.10.0"
futures_ringbuf = "0.4.0"
# `Keypair::generate_ed25519` (used by the tests) sits behind identity's `rand` feature, which the
# fork's workspace enabled for these tests through feature unification.
libp2p-identity = { version = "0.2.1", features = ["ed25519", "rand"] }
quickcheck = { package = "quickcheck-ext", git = "https://github.com/KomodoPlatform/rust-libp2p.git", tag = "k-0.52.12" }

# Passing arguments to the docsrs builder in order to properly document cfg's.
# More information: https://docs.rs/about/builds#cross-compiling
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
rustc-args = ["--cfg", "docsrs"]
