    "dep:futures-util",
]
test-dependencies = [
    "dep:ambassador",
    "dep:assert_matches",
    "dep:proptest",
    "dep:jubjub",
    "dep:rand",
    "dep:rand_chacha",
    "transparent/test-dependencies",
    "orchard?/test-dependencies",
    "zcash_keys/test-dependencies",
    "zcash_primitives/test-dependencies",
    "zcash_proofs/bundled-prover",
