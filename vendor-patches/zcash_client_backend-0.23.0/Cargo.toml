    "dep:rand",
    "dep:rust_decimal",
    "dep:serde",
    "dep:serde_json",
    "dep:tokio",
    "dep:tokio-rustls",
    "dep:tor-rtcompat",
    "dep:trait-variant",
    "dep:tower",
    "dep:webpki-roots",
]
transparent-inputs = [
    "dep:bip32",
    "dep:secp256k1",
    "transparent/transparent-inputs",
    "zcash_keys/transparent-inputs",
    "zcash_primitives/transparent-inputs",
]
