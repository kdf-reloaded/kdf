# This section is considered when running `cargo deny check bans`.
# More documentation about the 'bans' section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/bans/cfg.html
[bans]
# Lint level for when multiple versions of the same crate are detected.
# DELIBERATELY "allow": the tree carries many pre-existing duplicate versions
# (bech32, bitcoin_hashes, bitflags, ...) and no duplicate-version cleanup is
# scoped. This section is a targeted ban list (see `deny` below), not a
# duplicate-version gate. Do not read a green `cargo deny check bans` as "no
# duplicates".
multiple-versions = "allow"
# Lint level for when a crate version requirement is `*`
wildcards = "allow"
# The graph highlighting used when creating dotgraphs for crates
# with multiple versions
# * lowest-version - The path to the lowest versioned duplicate is highlighted
# * simplest-path - The path to the version with the fewest edges is highlighted
# * all - Both lowest-version and simplest-path are used
highlight = "all"
# List of crates that are allowed. Use with care!
allow = [
    #{ name = "ansi_term", version = "=0.11.0" },
]
# List of crates to deny
deny = [
    # A second rustls CryptoProvider panics at runtime on first connect ("could
    # not automatically determine the process-level CryptoProvider"), not at
    # build time. The tree uses ring only. aws-lc-rs and its -sys crate are
    # separate packages, so each has its own entry.
    { name = "aws-lc-rs" },
    { name = "aws-lc-sys" },
    { name = "aws-lc-fips-sys" },
    # rustls 0.23.46 is the patched floor for RUSTSEC-2026-0349.
    { name = "rustls", version = "<0.23.46" },
]
# NOTE: a curated `skip` list of ~110 entries was removed from here because it is
# inert under multiple-versions = "allow" and warned once per entry. It survives
# in git as deny.toml at bc47dc07d (parent of the removing commit): the starting
# point if a duplicate-version cleanup is scoped. Flipping multiple-versions to
# "warn"/"deny" without reinstating or re-triaging it surfaces every duplicate.
# Certain crates/versions that will be skipped when doing duplicate detection.
# The goal is to reduce this list as much as possible
skip = [
]
# Similarly to `skip` allows you to skip certain crates during duplicate 
# detection. Unlike skip, it also includes the entire tree of transitive 
# dependencies starting at the specified crate, up to a certain depth, which is
# by default infinite
skip-tree = [
    #{ name = "ansi_term", version = "=0.11.0", depth = 20 },
]

# This section is considered when running `cargo deny check sources`.
# More documentation about the 'sources' section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/sources/cfg.html
[sources]
# Lint level for what to happen when a crate from a crate registry that is not
# in the allow list is encountered
unknown-registry = "warn"
# Lint level for what to happen when a crate from a git repository that is not
# in the allow list is encountered
unknown-git = "warn"
# List of URLs for allowed crate registries. Defaults to the crates.io index
# if not specified. If it is specified but empty, no registries are allowed.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# List of URLs for allowed Git repositories
allow-git = []

[sources.allow-org]
# 1 or more github.com organizations to allow git sources for
github = [""]
# 1 or more gitlab.com organizations to allow git sources for
gitlab = [""]
# 1 or more bitbucket.org organizations to allow git sources for
bitbucket = [""]
