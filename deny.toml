# This template contains all of the possible sections and their default values

# Note that all fields that take a lint level have these possible values:
# * deny - An error will be produced and the check will fail
# * warn - A warning will be produced, but the check will not fail
# * allow - No warning or error will be produced, though in some cases a note
# will be

# The values provided in this template are the default values that will be used
# when any section or field is not specified in your own configuration

# If 1 or more target triples (and optionally, target_features) are specified,
# only the specified targets will be checked when running `cargo deny check`.
# (cargo-deny schema v2 moved this key from the top level into [graph].)
[graph]
targets = [
    # The triple can be any string, but only the target triples built in to
    # rustc (as of 1.40) can be checked against actual config expressions
    #{ triple = "x86_64-unknown-linux-musl" },
    # You can also specify which target_features you promise are enabled for a
    # particular target. target_features are currently not validated against
    # the actual valid features supported by the target architecture.
    #{ triple = "wasm32-unknown-unknown", features = ["atomics"] },
]

# This section is considered when running `cargo deny check advisories`
# More documentation for the advisories section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html
[advisories]
# The path where the advisory database is cloned/fetched into
db-path = "~/.cargo/advisory-db"
# The url(s) of the advisory databases to use
db-urls = ["https://github.com/rustsec/advisory-db"]
# cargo-deny schema v2 (>= 0.16): `vulnerability` advisories are hard errors
# unless listed in `ignore` below. Only `unmaintained` and `yanked` remain
# tunable.
#
# CORRECTION (2026-09-23): this block used to claim that `unsound` advisories are
# hard errors too. Measured with the CI-pinned cargo-deny 0.19.9, that is not the
# behaviour we get. The tree contains lock_api 0.3.4 (RUSTSEC-2020-0070),
# lru 0.7.5 (RUSTSEC-2026-0002) and rand 0.7.3 (RUSTSEC-2026-0097) -- all three
# `informational = "unsound"` and all three below their patched versions -- and
# `cargo deny check advisories` still reports `advisories ok`. Adding those IDs to
# `ignore` produces `advisory-not-detected: no crate matched advisory criteria`,
# i.e. cargo-deny never matched them against the graph in the first place, so they
# are documented in a comment below rather than listed as ignores. Do not assume
# this gate covers unsound advisories.
#
# Note also what this gate CANNOT see: cargo-deny reads RustSec, and the GitHub
# Advisory Database is a superset. The `dependabot-alerts` job in
# .github/workflows/audit.yml covers the GHSA-only advisories -- see its comment
# for why that gap mattered in practice.
#
# We do NOT fail on unmaintained-crate advisories: this gate targets actual
# vulnerabilities, and the tree carries ~30 transitively-unmaintained crates
# (aes-soft, atty, bincode, async-std, ...) that are not independently
# actionable. Yanked crates only warn so a mid-flight yank does not wedge CI.
unmaintained = "none"
yanked = "warn"
# A list of advisory IDs to ignore. Note that ignored advisories will still
# output a note when they are encountered.
#
# Each accepted advisory is grouped by its root cause and the reason it cannot
# currently be resolved. Entries marked "scheduled" are reloaded-owned roots
# with dedicated migration work planned; the rest are upstream-blocked (they
# live in third-party / forked dependencies we do not control). See
# docs/reloaded-rewrite/28-libp2p-modernization.md (OQ2) for the libp2p residue.
ignore = [
    # --- libp2p 0.52 fork (KomodoPlatform/rust-libp2p k-0.52.12) ---
    # The fork's own 0.52-era WSS/TLS + trust-dns + tempfile stack pulls these.
    # We must stay on the fork for the relay-mesh gossipsub extension; clearing
    # them requires upstream fork modernization. The WSS rustls/ring/webpki line
    # is additionally coupled to reloaded's futures-rustls transport binding.
    # (libp2p-websocket itself is vendored on rustls 0.23 -- see vendor-patches/
    # libp2p-websocket-0.42.0. No rustls 0.20 consumer remains; the former
    # RUSTSEC-2024-0336 (rustls), RUSTSEC-2023-0052 (webpki) and RUSTSEC-2025-0009
    # (ring) ignores went with it.)
    "RUSTSEC-2024-0421", # idna (fork libp2p-dns -> trust-dns-proto 0.22)

    # --- Misattributed to the libp2p fork; kept, but for a different reason ---
    # CORRECTION (2026-09-23): `cargo tree -i` shows neither of these comes from
    # libp2p. mio 0.7.13 is pulled by crossterm and signal-hook-mio (the TUI path
    # in common/gstuff/mm2_test_helpers); remove_dir_all 0.5.3 by tempfile 3.3.0
    # (prost-build, rusty-fork). Both are therefore clearable independently of the
    # fork -- ch28's OQ2 residue list is two entries shorter than it claims.
    "RUSTSEC-2024-0019", # mio (crossterm / signal-hook-mio)
    "RUSTSEC-2023-0018", # remove_dir_all (tempfile 3.3.0)

    # --- Solana SDK (via solana-keypair) ---
    # Old ed25519/curve25519 persist through the Solana SDK, independent of
    # libp2p; cleared only by an upstream Solana SDK bump.
    "RUSTSEC-2022-0093", # ed25519-dalek 1.x (double public key signing oracle)
    "RUSTSEC-2024-0344", # curve25519-dalek (timing variability)

    # --- Unsound advisories (transitive) ---
    # Listed as accepted risk. (These were added believing schema v2 made
    # `unsound` a hard error; it does not -- see the CORRECTION at the top of this
    # section. They stay because the rationale below is still the reason we live
    # with them.)
    # - rmp-serde (RUSTSEC-2022-0092): a *direct* dependency, but the patched 1.x
    #   line changes the MessagePack enum encoding (integer variant index ->
    #   variant name), which would break P2P wire compatibility with GLEEC and
    #   existing nodes. Blocked pending a custom integer-variant serializer.
    # - secp256k1 0.20 (RUSTSEC-2022-0070): pinned by deeper dependencies.
    "RUSTSEC-2022-0092", # rmp-serde Raw/RawRef unsound
    "RUSTSEC-2022-0070", # secp256k1 0.20 use-after-free in safe code

    # --- Residual `unsound` advisories: accepted, NOT listed as ignores ---
    # cargo-deny does not match these against the graph (see the CORRECTION at the
    # top of this section), so an `ignore` entry would only emit
    # `advisory-not-detected` noise. They are dismissed on the GitHub Security tab;
    # the rationale lives here so it is in one place. Each is an old version pinned
    # transitively -- none is independently bumpable without moving its pinner.
    #
    # - RUSTSEC-2020-0070 / GHSA-hj9h-wrgg-hgmx et al: lock_api 0.3.4
    #   <- parking_lot 0.9.0 <- wasm-timer 0.2.4, unmaintained since 2020 and used
    #   by common, mm2_main and mm2_p2p. Clearing it means replacing wasm-timer.
    # - RUSTSEC-2026-0002 / GHSA-rhfx-m35p-ff5j: lru 0.7.5 <- parity-util-mem 0.11
    #   <- the sp-* (Substrate 6.0) stack; lru 0.10.1 <- the fork's libp2p-identify.
    # - RUSTSEC-2026-0097 / GHSA-cq8v-f236-94qc: rand 0.7.3 <- the fork's
    #   cuckoofilter, the Solana SDK's ed25519-dalek 1.x, and tiny-bip39 0.8.2 --
    #   the same upstream roots already accepted above.
    #
    # - RUSTSEC-2022-0041 / GHSA-qc84-gqf4-9926: crossbeam-utils 0.7.2
    #   <- async-std 1.6.2, a direct dependency of common, coins and mm2_main.
    #   Affects only `AtomicCell<{i,u}64>` fetch_* on 32-bit targets that have
    #   Atomic{I,U}64; 64-bit targets are unaffected outright. async-std cannot
    #   move without code changes: 1.9 removed `async_std::sync::channel`, which
    #   the swap shutdown path still uses (mm2_main/src/lp_swap.rs:360, plus
    #   `Receiver::clone`/`recv` in maker_swap.rs and taker_swap.rs, where recv
    #   returns Option today and Result on the async-channel replacement).
    #   Tracked as its own item -- see docs/plans/v0.2.0-dependency-hygiene.md.
    #
    #   CORRECTION (2026-09-23): the first version of this block claimed this
    #   advisory was cleared by the dirs 1 -> 6 and hdrhistogram 7.1 -> 7.6 bumps.
    #   Those did remove two of the three pullers (rust-argon2 0.7 via
    #   redox_users, and crossbeam-channel 0.4), but async-std 1.6.2 is a third
    #   and is sufficient on its own. The clearance was verified while async-std
    #   was briefly at 1.13.2 and not re-verified after that bump was reverted
    #   for breaking the build.

    # Cleared in the same pass, recorded so it is not re-introduced:
    # - RUSTSEC-2021-0145 (atty): env_logger 0.7 -> 0.11 in mm2_p2p, moved to
    #   dev-dependencies since it is only used from tests. atty left the graph.
]
# Threshold for security vulnerabilities, any vulnerability with a CVSS score
# lower than the range specified will be ignored. Note that ignored advisories
# will still output a note when they are encountered.
# * None - CVSS Score 0.0
# * Low - CVSS Score 0.1 - 3.9
# * Medium - CVSS Score 4.0 - 6.9
# * High - CVSS Score 7.0 - 8.9
# * Critical - CVSS Score 9.0 - 10.0
#severity-threshold = 

# This section is considered when running `cargo deny check licenses`
# More documentation for the licenses section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html
[licenses]
# cargo-deny schema v2: every license not in `allow` (or in a per-crate
# `exceptions` entry) is denied. CI runs `cargo deny check licenses`, so a new
# dependency must carry a license compatible with the GPL-2.0-only combined
# work, see LEGAL/LICENSING-POLICY.md. Choosing the compatible alternative of a
# disjunctive expression (e.g. MIT in `MIT OR Apache-2.0`) is automatic.
# See https://spdx.org/licenses/ for valid SPDX identifiers.
allow = [
    "0BSD",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-2.0-only",
    "GPL-2.0-or-later",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
# `GPL-2.0-or-later` is listed ahead of use for first-party crates.
unused-allowed-license = "allow"
# The confidence threshold for detecting a license from license text.
# The higher the value, the more closely the license text must be to the
# canonical license text of a valid SPDX license file.
# [possible values: any between 0.0 and 1.0].
confidence-threshold = 0.8
