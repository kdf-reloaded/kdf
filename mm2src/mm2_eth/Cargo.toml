[package]
name = "mm2_eth"
version = "0.1.0"
edition = "2021"

[lib]
doctest = false

[dependencies]
ethereum-types.workspace = true
hex.workspace = true
indexmap = { version = "1.7", features = ["serde-1"] }
mm2_err_handle.workspace = true
secp256k1 = { version = "0.20", features = ["recovery"] }
serde.workspace = true
serde_json.workspace = true
tiny-keccak = { version = "2.0", features = ["keccak"] }
zeroize = "1"
# LP-17: web3 dropped (typed_data.rs uses local TypedDataError now).
# alloy is no longer required by this crate either; reintroduce later
# if/when keys.rs or new modules need alloy types.
