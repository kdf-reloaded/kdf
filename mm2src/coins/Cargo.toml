[package]
name = "coins"
version = "0.1.0"
edition = "2021"

[features]
zhtlc-native-tests = []
zhtlc = []
# The lightning `log_*!` macros check `cfg(feature = "max_level_*")` at compile-time.
# Declaring them avoids unexpected-cfg warnings without enabling any of them.
max_level_off = []
max_level_error = []
max_level_warn = []
max_level_info = []
max_level_debug = []
max_level_trace = []

[lib]
name = "coins"
path = "lp_coins.rs"
doctest = false

[dependencies]
async-std = { version = "1.5", features = ["unstable"] }
async-trait = "0.1.52"
base64 = "0.10.0"
base58 = "0.2.0"
bigdecimal = { version = "0.3", features = ["serde"] }
bip32 = { version = "0.2.2", default-features = false, features = ["alloc", "secp256k1-ffi"] }
bitcoin = "0.27.1"
bitcoin_hashes = "0.10.0"
blake2b_simd = "1"
kdf_crypto = { path = "../kdf_crypto" }
bincode = "1.3.3"
byteorder = "1.3"
bytes = "0.4"
cfg-if = "1.0"
chain = { package = "kdf_chain", path = "../kdf_chain" }
common = { path = "../common" }
mm2_core = { path = "../mm2_core" }
mm2_metrics = { path = "../mm2_metrics" }
mm2_err_handle = { path = "../mm2_err_handle" }
mm2_net = { path = "../mm2_net" }
mm2_net_config = { path = "../mm2_net_config" }
mm2_number = { path = "../mm2_number" }
regex = "1"
url = { version = "2.2.2", features = ["serde"] }
mm2_db = { path = "../mm2_db" }
mm2_io = { path = "../mm2_io" }
mm2_test_helpers = { path = "../mm2_test_helpers" }
crypto = { path = "../crypto" }
cosmrs = { workspace = true }
db_common = { path = "../db_common" }
derive_more = "0.99"
ed25519-dalek = "1.0.1"
ed25519-dalek-bip32 = "0.2.0"
ethabi = { path = "../ethabi-vendored" }
ethereum-types = { version = "0.4", default-features = false, features = ["std", "serialize"] }
mm2_eth = { path = "../mm2_eth" }
# Waiting for https://github.com/rust-lang/rust/issues/54725 to use on Stable.
#enum_dispatch = "0.1"
fomat-macros = "0.2"
futures01 = { version = "0.1", package = "futures" }
# using select macro requires the crate to be named futures, compilation failed with futures03 name
futures = { version = "0.3", package = "futures", features = ["compat", "async-await"] }
gstuff = { version = "0.7" }
hex = "0.4.2"
http = "0.2"
indexmap = { version = "1.7", features = ["serde-1"] }
itertools = { version = "0.10", features = ["use_std"] }
jsonrpc-core = "8.0.1"
kdf_walletconnect = { path = "../kdf_walletconnect" }
keys = { package = "kdf_keys", path = "../kdf_keys" }
lazy_static = "1.4"
libc = "0.2"
lightning = { path = "../../rust-lightning-patched/lightning" }
lightning-background-processor = { path = "lightning_background_processor" }
lightning-invoice = { path = "../../rust-lightning-patched/lightning-invoice" }
metrics = "0.12"
mocktopus = "0.8.0"
num-traits = "0.2"
parking_lot = { version = "0.12.0" }
primitives = { package = "kdf_primitives", path = "../kdf_primitives" }
prost = { workspace = true }
prost-types = { workspace = true }
rand = { version = "0.7", features = ["std", "small_rng"] }
rmp-serde = "0.14.3"
rpc = { package = "kdf_rpc_types", path = "../kdf_rpc_types" }
rpc_task = { path = "../rpc_task" }
script = { package = "kdf_script", path = "../kdf_script" }
secp256k1 = { version = "0.20" }
ser_error = { path = "../derives/ser_error" }
ser_error_derive = { path = "../derives/ser_error_derive" }
serde = "1.0"
serde_derive = "1.0"
serde_json = { version = "1.0", features = ["preserve_order", "raw_value"] }
serialization = { package = "kdf_codec", path = "../kdf_codec" }
serialization_derive = { package = "kdf_codec_derive", path = "../kdf_codec_derive" }
spv_validation = { package = "kdf_spv_validation", path = "../kdf_spv_validation" }
sha2 = "0.9"
sha3 = "0.9"
sia-rust = { workspace = true }
# using the same version as cosmrs
tendermint-rpc = { workspace = true }
thiserror = { workspace = true }
utxo_signer = { path = "utxo_signer" }
tiny-bip39 = "0.8.0"
uuid = { workspace = true }
# Modern Rust Ethereum stack — fully replaces `web3` (LP-17 Phase 4c).
# Wire-compatible JSON-RPC types (Filter/Trace/CallRequest/etc) are
# vendored locally in `eth/wire_types.rs`.
alloy = { workspace = true }
tower = { workspace = true }
winapi = "0.3"
zbase32 = "0.1.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3.27" }
# uuid v1 needs an explicit RNG source on `wasm32-unknown-unknown`; the
# `js` feature wires it through `getrandom`'s JS backend.
uuid = { version = "1", features = ["v4", "serde", "js"] }
wasm-bindgen = { version = "0.2.50" }
wasm-bindgen-futures = { version = "0.4.1" }
wasm-bindgen-test = { version = "0.3.2" }
web-sys = { version = "0.3.55", features = ["console", "Headers", "Request", "RequestInit", "RequestMode", "Response", "Window"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = { version = "1" }
hyper = { version = "0.14", features = ["client", "http2", "http1"] }
hyper-rustls = { version = "0.23", default-features = false, features = ["http1", "http2", "webpki-roots", "webpki-tokio"] }
lightning-persister = { path = "lightning_persister" }
lightning-net-tokio = { path = "../../rust-lightning-patched/lightning-net-tokio" }
rust-ini = { version = "0.13" }
rustls = { version = "0.20", features = ["dangerous_configuration"] }
tokio = { version = "1.7" }
tokio-rustls = { version = "0.23" }
tonic = { version = "0.11", features = ["tls", "channel"] }
webpki-roots = { version = "0.22" }
zcash_client_backend = { path = "../../librustzcash-patched/zcash_client_backend" }
zcash_client_sqlite = { path = "../../librustzcash-patched/zcash_client_sqlite" }
zcash_primitives = { features = ["transparent-inputs"], path = "../../librustzcash-patched/zcash_primitives" }
zcash_proofs = { path = "../../librustzcash-patched/zcash_proofs" }

# Solana stack — modular `solana-*` 2.x crates plus `spl-token` 8 and
# the `spl-associated-token-account-client` helper. The legacy
# `solana-client` 1.x and `solana-sdk` 1.x crates were removed in P14
# because their transitive deps (`solana-remote-wallet` -> `hidapi` ->
# `libudev`) only build on Linux desktop. The modular crates carry no
# hardware-wallet code and rely on a hand-rolled async JSON-RPC client
# (`solana::rpc_client`) that runs on every native target. WASM stays
# excluded because `mm2_net::native_http` is tokio-native.
solana-commitment-config = { version = "2", default-features = false, features = ["serde"] }
solana-hash = { version = "2", default-features = false, features = ["serde"] }
solana-keypair = { version = "2", default-features = false }
solana-message = { version = "2", default-features = false, features = ["bincode"] }
solana-native-token = { version = "2", default-features = false }
solana-program-error = { version = "2", default-features = false }
solana-pubkey = { version = "2", default-features = false, features = ["serde", "std"] }
solana-signature = { version = "2", default-features = false, features = ["serde", "verify"] }
solana-signer = { version = "2", default-features = false }
solana-system-transaction = { version = "2", default-features = false }
solana-transaction = { version = "2", default-features = false, features = ["bincode"] }
spl-associated-token-account-client = { version = "2", default-features = false }
spl-token = { version = "8", default-features = false }

[build-dependencies]
prost-build = { version = "0.12", default-features = false }
tonic-build = { version = "0.11", features = ["prost"] }
