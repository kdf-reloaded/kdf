[package]
name = "crypto"
version = "1.0.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
test-helpers = []
# UDP transport for the Trezor emulator (native only, off by default). Used by the
# test/CI harness so the whole stack can talk to a Trezor emulator over UDP.
trezor-udp = ["trezor/trezor-udp"]

[dependencies]
# Cryptographic primitives for AES-256-CBC encryption
aes = "0.8.3"
# Argon2 password hashing / key derivation
argon2 = { version = "0.5.2", features = ["zeroize"] }
# Fixed-size array references
arrayref = "0.3"
async-trait = "0.1"
# Base64 encoding for encrypted data serialization
base64 = "0.21.2"
bip32 = { version = "0.2.2", default-features = false, features = ["alloc", "secp256k1-ffi"] }
# BIP39 mnemonic generation and seed derivation
bip39 = { version = "2.1.0", features = ["rand_core", "zeroize", "std"], default-features = false }
kdf_crypto = { path = "../kdf_crypto" }
# Base58 encoding for xpub prefix conversion
bs58 = "0.4.0"
# CBC block cipher mode
cbc = "0.1.2"
# Block cipher traits (alloc enables encrypt_padded_vec_mut / decrypt_padded_vec_mut)
cipher = { version = "0.4.4", features = ["alloc"] }
common = { path = "../common" }
derive_more = "0.99"
# Ed25519 HD key derivation (SLIP-0010)
ed25519-dalek-bip32 = "0.3.0"
enum-primitive-derive = "0.2"
futures = "0.3"
hex = "0.4.2"
# HMAC-SHA256 for authenticated encryption
hmac = "0.12.1"
http = "0.2"
hw_common = { path = "../hw_common" }
keys = { package = "kdf_keys", path = "../kdf_keys" }
lazy_static = "1.4"
mm2_core = { path = "../mm2_core" }
mm2_err_handle = { path = "../mm2_err_handle" }
num-traits = "0.2"
parking_lot = { version = "0.12.0" }
primitives = { package = "kdf_primitives", path = "../kdf_primitives" }
rpc_task = { path = "../rpc_task" }
rustc-hex = "2"
secp256k1 = "0.20"
ser_error = { path = "../derives/ser_error" }
ser_error_derive = { path = "../derives/ser_error_derive" }
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0"
# SHA-2 family (SHA-256) for HMAC and key derivation
sha2 = "0.10"
# Derive Error trait implementations
thiserror = "1.0.40"
trezor = { path = "../trezor" }
# Secure memory zeroization for sensitive data (seeds, keys)
zeroize = { version = "1.8.1", features = ["zeroize_derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
mm2_eth = { path = "../mm2_eth" }
mm2_metamask = { path = "../mm2_metamask" }
