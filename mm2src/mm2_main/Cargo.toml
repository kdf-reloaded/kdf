# Support for split-debuginfo [should eventually](https://github.com/rust-lang/rust/issues/34651) land,
# hopefully giving us an out-of-the-box way to separate the code from the debugging information.
# We should use the "objcopy --only-keep-debug" and "add-symbol-file" meanwhile
# and separating stack tracing into raw trace and symbolication parts.

[package]
name = "mm2_main"
version = "0.1.0"
edition = "2021"
default-run = "kdf"

# wasm-opt reduces the size from 17 Mb to 14. But it runs for few minutes, which is not good for CI.
# For production builds, it's recommended to run wasm-opt separately.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[features]
# Deprecated
native = []
track-ctx-pointer = ["common/track-ctx-pointer"]
custom-swap-locktime = [] # only for testing purposes, should never be activated on release builds.
ibc-routing-for-swaps = []
zhtlc-native-tests = ["coins/zhtlc-native-tests"]
# Compiles in netid 9000 (regtest) for the docker_tests harness.
# Never enable on the production `kdf` binary.
regtest-netid = ["mm2_net_config/regtest-netid"]
# Debugging-only RPC wire dump. Requires explicit runtime env activation too.
unsafe-rpc-wire-dump = []
# Escape hatch for controlled release debugging. Never enable in production builds.
unsafe-rpc-wire-dump-release-override = []

[[bin]]
name = "kdf"
path = "src/mm2_bin.rs"
test = false
doctest = false
bench = false

[[bin]]
name = "docker_tests"
path = "src/docker_tests.rs"

[lib]
name = "kdflib"
path = "src/mm2_lib.rs"
crate-type = ["lib", "cdylib", "staticlib"]
test = false
doctest = false
bench = false

[dependencies]
async-std = { version = "1.5", features = ["unstable"] }
async-trait = "0.1"
kdf_crypto = { path = "../kdf_crypto" }
kdf_walletconnect = { path = "../kdf_walletconnect" }
blake2 = "0.10"
bytes = "0.4"
chain = { package = "kdf_chain", path = "../kdf_chain" }
cfg-if = "1.0"
coins = { path = "../coins" }
coins_activation = { path = "../coins_activation" }
common = { path = "../common" }
mm2_metrics = { path = "../mm2_metrics" }
mm2_test_helpers = { path = "../mm2_test_helpers" }
mm2_err_handle = { path = "../mm2_err_handle" }
mm2_event_stream = { path = "../mm2_event_stream" }
mm2_gui_storage = { path = "../mm2_gui_storage" }
mm2_io = { path = "../mm2_io" }
mm2_rpc = { path = "../mm2_rpc" }
mm2_state_machine = { path = "../mm2_state_machine" }
mm2_net = { path = "../mm2_net" }
mm2_net_config = { path = "../mm2_net_config" }
mm2_core = { path = "../mm2_core" }
mm2_db = { path = "../mm2_db" }
crc32fast = { version = "1.3.2", features = ["std"] }
crossbeam = "0.7"
crypto = { path = "../crypto" }
db_common = { path = "../db_common" }
derive_more = "0.99"
either = "1.6"
ethereum-types.workspace = true
enum-primitive-derive = "0.2"
fomat-macros = "0.2"
futures01 = { version = "0.1", package = "futures" }
futures-cpupool = "0.1"
futures = { version = "0.3.1", package = "futures", features = ["compat", "async-await"] }
gstuff = { version = "0.7" }
hash256-std-hasher = "0.15.2"
hash-db = "0.15.2"
hex = "0.4.2"
http = "0.2"
hw_common = { path = "../hw_common" }
itertools = "0.10"
keys = { package = "kdf_keys", path = "../kdf_keys" }
lazy_static = "1.4"
# ledger = { path = "../ledger" }
libc = "0.2"
metrics = "0.12"
mm2_p2p = { path = "../mm2_p2p", features = ["application"] }
num-traits = "0.2"
rpc = { package = "kdf_rpc_types", path = "../kdf_rpc_types" }
rpc_task = { path = "../rpc_task" }
parking_lot = { version = "0.12.0" }
parity-util-mem = "0.11"
primitives = { package = "kdf_primitives", path = "../kdf_primitives" }
prost = { workspace = true }
rand = { version = "0.7", features = ["std", "small_rng"] }
rand6 = { version = "0.6", package = "rand" }
rmp-serde = "0.14.3"
# TODO: Reduce the size of regex by disabling the features we don't use.
# cf. https://github.com/rust-lang/regex/issues/583
regex = "1"
script = { package = "kdf_script", path = "../kdf_script" }
secp256k1 = { version = "0.20", features = ["rand"] }
serde = "1.0"
serde_json = { version = "1.0", features = ["preserve_order", "raw_value"] }
serde_derive = "1.0"
ser_error = { path = "../derives/ser_error" }
ser_error_derive = { path = "../derives/ser_error_derive" }
serialization = { package = "kdf_codec", path = "../kdf_codec" }
serialization_derive = { package = "kdf_codec_derive", path = "../kdf_codec_derive" }
spv_validation = { package = "kdf_spv_validation", path = "../kdf_spv_validation" }
sp-runtime-interface = { version = "6.0.0", default-features = false, features = ["disable_target_static_assertions"] }
sp-trie = { version = "6.0", default-features = false }
trading_api = { path = "../trading_api" }

timed-map = { version = "1.6", features = ["rustc-hash"] }
trie-db = { version = "0.23.1", default-features = false }
trie-root = "0.16.0"
uuid = { version = "0.7", features = ["serde", "v4"] }
wasm-timer = "0.2.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3.27" }
timed-map = { version = "1.6", features = ["rustc-hash", "wasm"] }
wasm-bindgen = { version = "0.2.88" }
wasm-bindgen-futures = { version = "0.4.1" }
wasm-bindgen-test = { version = "0.3.1" }
web-sys = { version = "0.3.55", features = ["console"] }
instant = {version = "0.1.12", features = ["wasm-bindgen"]}

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = { version = "1" }
hyper = { version = "0.14.11", features = ["client", "http2", "server", "tcp"] }
tokio = { version = "1.7", features = ["io-util", "rt-multi-thread", "net", "signal"] }
futures-rustls = { version = "0.21.1" }

[dev-dependencies]
crypto = { path = "../crypto", features = ["test-helpers"] }
mocktopus = "0.8.0"
testcontainers = { path = "../testcontainers-vendored" }
winapi = "0.3"

[build-dependencies]
chrono = "0.4"
gstuff = { version = "0.7" }
prost-build = "0.12"
regex = "1"
