[package]
name = "mm2_core"
version = "0.1.0"
edition = "2021"

[features]
track-ctx-pointer = []

[lib]
doctest = false

[dependencies]
async-trait = "0.1"
arrayref = "0.3"
derive_more = "0.99"
rand = { version = "0.8", features = ["std", "small_rng"] }
uuid = { version = "0.7", features = ["serde", "v4"] }
fomat-macros = "0.2"
serde = "1"
serde_bytes = "0.11"
hex = "0.4.2"
serde_json = { version = "1.0", features = ["preserve_order", "raw_value"] }
shared_ref_counter = { path = "../common/shared_ref_counter" }
cfg-if = "1.0"
primitives = { package = "kdf_primitives", path = "../kdf_primitives" }
keys = { package = "kdf_keys", path = "../kdf_keys" }
common = { path = "../common" }
db_common = { path = "../db_common" }
mm2_metrics = { path = "../mm2_metrics" }
mm2_rpc = { path = "../mm2_rpc" }
mm2_event_stream = { path = "../mm2_event_stream" }
lazy_static = "1.4"
futures = { version = "0.3", package = "futures", features = ["compat", "async-await", "thread-pool"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gstuff = { version = "0.7" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gstuff = { version = "0.7", features = ["crossterm"] }
