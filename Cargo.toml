[workspace]
members = [
    "mm2src/coins",
    "mm2src/common/shared_ref_counter",
    "mm2src/coins/lightning_persister",
    "mm2src/coins/lightning_background_processor",
    "mm2src/coins/utxo_signer",
    "mm2src/coins_activation",
    "mm2src/crypto",
    "mm2src/db_common",
    "mm2src/derives/enum_derives",
    "mm2src/derives/ser_error",
    "mm2src/derives/ser_error_derive",
    "mm2src/mm2_p2p",
    "mm2src/hw_common",
    "mm2src/kdf_crypto",
    "mm2src/kdf_primitives",
    "mm2src/kdf_codec",
    "mm2src/kdf_codec_derive",
    "mm2src/kdf_chain",
    "mm2src/kdf_script",
    "mm2src/kdf_keys",
    "mm2src/kdf_rpc_types",
    "mm2src/kdf_spv_validation",
    "mm2src/kdf_test_helpers",
    "mm2src/mm2_bitcoin_wire_tests",
    "mm2src/mm2_core",
    "mm2src/mm2_db",
    "mm2src/mm2_err_handle",
    "mm2src/mm2_eth",
    "mm2src/testcontainers-vendored",
    "mm2src/mm2_event_stream",
    "mm2src/mm2_metrics",
    "mm2src/mm2_test_helpers",

    "mm2src/mm2_main",
    "mm2src/mm2_net",
    "mm2src/mm2_net_config",
    "mm2src/mm2_number",
    "mm2src/mm2_state_machine",
    "mm2src/mm2_bin_lib",
    "mm2src/proxy_signature",
    "mm2src/mm2_git",
    "mm2src/mm2_gui_storage",
    "mm2src/mm2_io",
    "mm2src/mm2_rpc",
    "mm2src/rpc_task",
    "mm2src/trading_api",
    "mm2src/trezor",
    "mm2src/kdf_walletconnect",
    "mm2src/mm2_metamask",
]

# https://doc.rust-lang.org/beta/cargo/reference/features.html#feature-resolver-version-2
resolver = "2"

[workspace.dependencies]
# ── External crates (alphabetical) ──
alloy = { version = "2.0", default-features = false, features = [
    "consensus",
    "contract",
    "json-rpc",
    "network",
    "provider-http",
    "rlp",
    "rpc-types",
    "serde",
    "signers",
    "sol-types",
    "std",
] }
anyhow = "1"
async-trait = "0.1"
base64 = "0.21.2"
# rust-bitcoin family (CC0-1.0 / MIT) — Phase B parity-bitcoin replacement.
# bitcoinconsensus is intentionally NOT pulled in: it is Apache-2.0 which is
# incompatible with GPL-2.0-only. KDF script consumers are build/sign-only;
# no interpreter needed.
bitcoin = { version = "0.32", default-features = false, features = ["std", "secp-recovery"] }
bitcoin_hashes = { version = "0.14", default-features = false, features = ["std"] }
bitcoincash-addr = "0.5"
cfg-if = "1.0"
chrono = "0.4"
cosmrs = { version = "0.16", default-features = false }
crossbeam-channel = "0.5.1"
derive_more = "0.99"
ethereum-types = { version = "0.13", default-features = false, features = ["std", "serialize"] }
fomat-macros = "0.2"
futures = { version = "0.3", package = "futures", features = ["compat", "async-await"] }
gstuff = "0.7"
hex = "0.4.2"
hkdf = "0.12.4"
http = "0.2"
itertools = "0.10"
lazy_static = "1.4"
mocktopus = "0.8.0"
parking_lot = { version = "0.12.0", default-features = false }
rand = "0.8"
secp256k1 = "0.20"
serde = { version = "1", features = ["derive"] }
serde_derive = { version = "1", default-features = false }
serde_json = { version = "1.0", features = ["preserve_order", "raw_value"] }
serde_repr = "0.1.6"
sha2 = "0.10"
timed-map = { version = "1.5", features = ["rustc-hash", "serde"] }
tokio = { version = "1.47", default-features = false }
url = { version = "2.2.2", features = ["serde"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }

# ── WalletConnect relay protocol ──
pairing_api = { git = "https://github.com/komodoplatform/walletconnectrust", tag = "k-0.1.3" }
relay_client = { git = "https://github.com/komodoplatform/walletconnectrust", tag = "k-0.1.3" }
relay_rpc = { git = "https://github.com/komodoplatform/walletconnectrust", tag = "k-0.1.3" }
wc_common = { git = "https://github.com/komodoplatform/walletconnectrust", tag = "k-0.1.3" }

# ── Internal crates (alphabetical) ──
common = { path = "mm2src/common" }
mm2_core = { path = "mm2src/mm2_core" }
mm2_err_handle = { path = "mm2src/mm2_err_handle" }
mm2_main = { path = "mm2src/mm2_main" }
mm2_metrics = { path = "mm2src/mm2_metrics" }
mm2_number = { path = "mm2src/mm2_number" }
prost = "0.12"
prost-types = "0.12"
sia-rust = { path = "sia-rust-patched" }
# using the same version as cosmrs
tendermint-rpc = { version = "0.35", default-features = false }
thiserror = "1"
tower = "0.5"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
# Due to the "package" section only affects out-of-workspace crates, as intended.
debug = 0
debug-assertions = false
opt-level = 3
strip = true
codegen-units = 1
panic = 'unwind'


[profile.dev]
debug = 1
debug-assertions = false # TODO: Should we enable in the future?
opt-level = 0
strip = false
codegen-units = 128

[profile.release.package."*"]
# Turns debugging symbols off for the out-of-workspace dependencies.
debug = false

# bitcoin 0.27 / bitcoin_hashes 0.10 both declare an optional `core2 = "^0.3"`
# dep used only under `no-std`. Every 0.3.x release is yanked upstream, which
# blocks fresh resolution against vendored lightning/zcash crates. The shim at
# `core2-shim/` re-exports core2 0.4 under version 0.3.4 so the optional dep
# resolves without affecting any std build (no-std is never enabled here).
[patch.crates-io]
core2 = { path = "core2-shim" }
